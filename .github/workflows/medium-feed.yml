name: Update Medium publication feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-medium-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Medium posts
        run: node scripts/update-medium-feed.mjs

      - name: Commit and push updated feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medium-feed.json
          if git diff --cached --quiet; then
            echo "No Medium feed changes to commit."
          else
            git commit -m "Update Medium publication feed"
            git push origin HEAD:${{ github.ref_name }}
          fi
