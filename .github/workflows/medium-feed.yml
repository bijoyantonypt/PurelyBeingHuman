name: Update Medium publication feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-medium-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch latest Medium posts
        run: |
          for attempt in 1 2 3; do
            echo "Medium sync attempt $attempt..."
            if node scripts/update-medium-feed.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 20 seconds..."
              sleep 20
            fi
          done
          echo "Medium sync failed after 3 attempts."
          exit 1

      - name: Commit and push updated feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medium-feed.json
          if git diff --cached --quiet; then
            echo "No Medium feed changes to commit."
          else
            git commit -m "Update Medium publication feed"
            git push origin HEAD:${{ github.ref_name }}
          fi
